name: Deploy API to AWS ECR

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "!**"
  #     - "api/**"
  #     - ".github/workflows/cd_api.yml"
  #     - "!api/README.md"
  workflow_dispatch:

env:
  AWS_PROFILE_ACCOUNT: default
  AWS_REGION: ap-northeast-1
  project_name: template

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: api CD
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      # リポジトリをチェックアウト
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Login
      - name: Setup AWS Credentials
        uses: ./.github/actions/credential
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws_profile: ${{ env.AWS_PROFILE_ACCOUNT }}
          region: ${{ env.AWS_REGION }}

      # Docker イメージをプッシュ
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Push Docker image to AWS ECR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.project_name }}/api:latest

      # タスク定義の更新
      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.project_name }}-api-task-definition \
            --query taskDefinition \
            | jq 'del(.compatibilities, .taskDefinitionArn, .requiresAttributes, .revision, .status, .registeredAt, .registeredBy)' \
            > ecs-task-def.json

      - name: update ECS service
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ecs-task-def.json
          container-name: ${{ env.project_name }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.project_name }}/api:latest

      - name: update ECS service with new image
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ecs-task-def.json
          cluster: ${{ env.project_name }}-cluster
          service: ${{ env.project_name }}-api-service
          wait-for-service-stability: true

      - name: Close Connection
        if: always()
        run: |
          docker logout ${{ steps.login-ecr.outputs.registry }}
